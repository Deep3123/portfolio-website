<nav class="fixed top-0 left-0 right-0 z-50 glass backdrop-blur-md border-b border-dark-border/50 transition-all duration-300" [class.py-4]="!scrolled" [class.py-2]="scrolled" [ngClass]="{'bg-dark-card/80': scrolled}">
  <div class="max-w-[1400px] mx-auto px-6 sm:px-12 lg:px-24 flex justify-between items-center">
    <div class="text-xl font-bold font-mono text-gradient">
      <a href="#home">&lt;Deep/&gt;</a>
    </div>
    
    <!-- Desktop Menu -->
    <div class="hidden md:flex items-center space-x-8 text-sm font-medium">
      <a href="#about" class="text-gray-300 hover:text-primary-500 transition-colors">About</a>
      <a href="#skills" class="text-gray-300 hover:text-primary-500 transition-colors">Skills</a>
      <a href="#experience" class="text-gray-300 hover:text-primary-500 transition-colors">Experience</a>
      <a href="#projects" class="text-gray-300 hover:text-primary-500 transition-colors">Projects</a>

    </div>

    <!-- Mobile Menu Button -->
    <button class="md:hidden text-gray-300 hover:text-white" (click)="toggleMenu()">
      <svg *ngIf="!menuOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <svg *ngIf="menuOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="menuOpen" class="md:hidden absolute top-full left-0 right-0 glass-card m-4 p-4 flex flex-col space-y-4 shadow-2xl border-t-0 rounded-t-none">
    <a href="#about" class="text-gray-300 hover:text-primary-500 transition-colors" (click)="closeMenu()">About</a>
    <a href="#skills" class="text-gray-300 hover:text-primary-500 transition-colors" (click)="closeMenu()">Skills</a>
    <a href="#experience" class="text-gray-300 hover:text-primary-500 transition-colors" (click)="closeMenu()">Experience</a>
    <a href="#projects" class="text-gray-300 hover:text-primary-500 transition-colors" (click)="closeMenu()">Projects</a>
    <a href="#contact" class="text-primary-500 font-medium" (click)="closeMenu()">Contact</a>
